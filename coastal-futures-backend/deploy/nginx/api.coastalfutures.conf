# /etc/nginx/sites-available/api.coastalfutures.conf
# Reverse proxy nginx (hôte) -> API Flask (conteneur Docker sur 127.0.0.1:8000).
# Config HTTP initiale : `certbot --nginx` y ajoutera automatiquement le bloc
# HTTPS (443), la redirection 80->443 et les chemins des certificats.
#
# Adapter `server_name` à VOTRE sous-domaine d'API.

server {
    listen 80;
    listen [::]:80;
    server_name api.coastalfuturesafrica.org;

    # Taille max des requêtes (marge pour de futurs uploads).
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
