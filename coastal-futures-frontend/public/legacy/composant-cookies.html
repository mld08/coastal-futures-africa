<script>
(function(){
  var KEY='cf_cookies';
  var cookie=document.getElementById('cookie');
  function open(){ cookie.classList.add('show'); }
  function close(){ cookie.classList.remove('show'); }
  var stored=null; try{stored=localStorage.getItem(KEY);}catch(e){}
  if(!stored){ setTimeout(open,500); }
  function choose(v){ try{localStorage.setItem(KEY,v);}catch(e){} close(); }
  document.getElementById('accept').addEventListener('click',function(){choose('accepted');});
  document.getElementById('refuse').addEventListener('click',function(){choose('refused');});
  document.getElementById('custom').addEventListener('click',function(){choose('custom');});
  document.getElementById('replay').addEventListener('click',function(){ try{localStorage.removeItem(KEY);}catch(e){} open(); });
})();
</script>
