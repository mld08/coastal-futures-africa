<main class="page" data-screen-label="Sélecteur langue FR/EN">
  <span id="cf-main" tabindex="-1"></span><h1>Sélecteur de langue</h1>
  <p class="sub">FR / EN, langue active en teal. Détection automatique au premier chargement, persistance dans le navigateur.</p>

  <div class="detect" id="detectBadge"><i class="ti ti-language"></i><span id="detectText">Langue détectée…</span></div>

  <div class="spec-label" style="margin-top:30px;">Toggle inline (nav)</div>
  <div class="frame">
    <span class="lang" data-langset><b data-l="FR">FR</b><span class="sep">/</span><b data-l="EN">EN</b></span>
    <span class="note">Utilisé dans la barre de navigation.</span>
  </div>

  <div class="spec-label">Segmented</div>
  <div class="frame">
    <div class="seg" data-langset><button data-l="FR">Français</button><button data-l="EN">English</button></div>
  </div>

  <div class="spec-label">Dropdown (avec drapeaux)</div>
  <div class="frame">
    <div class="dd" id="dd">
      <button class="dd-btn" id="ddBtn"><span class="fl"><img width="1280" height="853" loading="lazy" decoding="async" id="ddFlag" src="assets/flags/fr.png" alt=""></span><span id="ddLabel">Français</span><i class="ti ti-chevron-down chev"></i></button>
      <div class="dd-menu" data-langset-menu>
        <button data-l="FR"><span class="fl"><img width="1280" height="853" loading="lazy" decoding="async" src="assets/flags/fr.png" alt=""></span>Français<i class="ti ti-check ck"></i></button>
        <button data-l="EN"><span class="fl"><img width="1000" height="600" loading="lazy" decoding="async" src="assets/flags/gb.svg" alt=""></span>English<i class="ti ti-check ck"></i></button>
      </div>
    </div>
    <span class="cur">Langue active : <b id="curLang">Français</b></span>
  </div>
</main>

<script>
(function(){
  var KEY='cf_lang';
  var detected=(navigator.language||'fr').toLowerCase().indexOf('en')===0?'EN':'FR';
  var stored=null; try{stored=localStorage.getItem(KEY);}catch(e){}
  var lang=stored||detected;
  document.getElementById('detectText').textContent = stored ? ('Préférence enregistrée : '+stored) : ('Détectée via navigator.language : '+detected+' ('+(navigator.language||'?')+')');

  var LBL={FR:'Français',EN:'English'};
  var FLAGS={FR:'assets/flags/fr.png',EN:'assets/flags/gb.svg'};

  function apply(){
    // inline toggles + segmented
    [].slice.call(document.querySelectorAll('[data-langset]')).forEach(function(g){
      [].slice.call(g.querySelectorAll('[data-l]')).forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l')===lang); });
    });
    // dropdown
    document.getElementById('ddLabel').textContent=LBL[lang];
    document.getElementById('ddFlag').src=FLAGS[lang];
    document.getElementById('curLang').textContent=LBL[lang];
    [].slice.call(document.querySelectorAll('[data-langset-menu] [data-l]')).forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l')===lang); });
    document.documentElement.lang=lang.toLowerCase();
  }
  function setLang(l){ lang=l; try{localStorage.setItem(KEY,l);}catch(e){} apply(); document.getElementById('detectText').textContent='Préférence enregistrée : '+l; }

  [].slice.call(document.querySelectorAll('[data-langset] [data-l], [data-langset-menu] [data-l]')).forEach(function(b){
    b.addEventListener('click',function(){ setLang(b.getAttribute('data-l')); document.getElementById('dd').classList.remove('open'); });
  });
  var dd=document.getElementById('dd');
  document.getElementById('ddBtn').addEventListener('click',function(e){e.stopPropagation();dd.classList.toggle('open');});
  document.addEventListener('click',function(){dd.classList.remove('open');});
  apply();
})();
</script>
